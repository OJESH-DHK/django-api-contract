[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "django-api-contract"
version = "0.1.0"
description = "Keep OpenAPI schemas and Postman collections in sync with your Django REST Framework API."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Ojesbi Rajan Dhakal" }]
keywords = ["django", "djangorestframework", "openapi", "postman", "api", "contract"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
    "drf-spectacular>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-django>=4.7",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.urls]
Homepage = "https://github.com/OJESH-DHK/django-api-contract"
Source = "https://github.com/OJESH-DHK/django-api-contract"
Changelog = "https://github.com/OJESH-DHK/django-api-contract/blob/main/CHANGELOG.md"
Issues = "https://github.com/OJESH-DHK/django-api-contract/issues"

[tool.hatch.build.targets.wheel]
packages = ["django_api_contract"]

[tool.hatch.build.targets.sdist]
include = ["/django_api_contract", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
